name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Hourly observations from 10:17–23:17 UTC. This is 6:17 AM–7:17 PM EDT
    # (one hour later in EST) and gives first-seen posting times one-hour precision.
    - cron: "17 10-23 * * *"
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore posting-time observations
        uses: actions/cache/restore@v4
        with:
          path: .tracking/posting-times.json
          key: posting-times-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            posting-times-${{ github.ref_name }}-

      - name: Test
        run: npm test

      - name: Generate daily picks
        run: npm run build:pages

      - name: Save posting-time observations
        uses: actions/cache/save@v4
        with:
          path: .tracking/posting-times.json
          key: posting-times-${{ github.ref_name }}-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
